function claim(){

 navBar();

 const pending=
  localStorage.getItem("vyroReferral")||"";

 app.innerHTML=`

 <div class="wrap">

  <div class="card glass auth screen">

   <div class="center">

    <div class="logo-mark">V</div>

    <h2 style="font:700 25px 'Space Grotesk'">
     Claim your identity
    </h2>

    <p class="sub" style="margin-top:7px">
     Pick the username people will use to find you.
    </p>

   </div>

   <label>Username</label>

   <input
    id="claimName"
    maxlength="32"
    placeholder="yourname"
    autocomplete="off"
   >

   <div id="claimHint" class="status"></div>

   <label>
    Referral code
    <span style="text-transform:none;letter-spacing:0">
     (optional)
    </span>
   </label>

   <input
    id="ref"
    maxlength="30"
    placeholder="e.g. SHARK25"
    value="${esc(pending)}"
   >

   <div class="claim-ref">
    <i class="fa-solid fa-gift"></i>
    Use a referral code to receive a starter XP bonus.
   </div>

   <button
    class="btn primary"
    id="claimBtn"
    style="width:100%;margin-top:16px"
    disabled>
    Claim username
   </button>

   <div id="claimOut" class="status"></div>

  </div>

 </div>
 `;

 const n=document.getElementById("claimName");
 const h=document.getElementById("claimHint");
 const b=document.getElementById("claimBtn");

 let timer;

 n.oninput=()=>{

  let v=n.value
   .toLowerCase()
   .replace(/[^a-z0-9_-]/g,"");

  n.value=v;
  b.disabled=true;

  clearTimeout(timer);

  if(!/^[a-z0-9_-]{3,32}$/.test(v)){

   h.textContent=v?
    "3–32 characters, letters/numbers/_/- only":
    "";

   h.className="status bad";
   return;
  }

  h.textContent="checking…";
  h.className="status";

  timer=setTimeout(async()=>{

   try{

    const r=await getDocs(
     query(
      collection(requireDb(),"users"),
      where("username","==",v)
     )
    );

    if(r.empty){

     h.textContent="✓ username available";
     h.className="status ok";
     b.disabled=false;

    }else{

     h.textContent="username is taken";
     h.className="status bad";

    }

   }catch{

    h.textContent="couldn't check username";
    h.className="status bad";

   }

  },350);
 };


 b.onclick=async()=>{

  b.disabled=true;

  b.innerHTML=
   '<i class="fa-solid fa-circle-notch fa-spin"></i> Creating…';

  const username=n.value;
  const ref=document
   .getElementById("ref")
   .value
   .trim()
   .toUpperCase();

  try{

   const r=await getDocs(
    query(
     collection(requireDb(),"users"),
     where("username","==",username)
    )
   );

   if(!r.empty)
    throw Error("taken");

   const referralCode=
    makeCode(username);

   const data={

    username,

    bio:"",

    status:"",

    theme:"midnight",

    pfp:"",

    banner:"",

    ownerId:user.id,

    links:[],

    music:{
     url:"",
     title:"",
     artist:"",
     autoplay:false,
     loop:true
    },

    badges:["welcome"],

    stats:{
     views:0,
     likes:0,
     referrals:0
    },

    referralCode,

    xp:ref?250:100,

    level:1,

    achievements:[
     "first-profile"
    ],

    effects:{
     particles:true,
     avatarGlow:true
    },

    customFeatures:{
     customCSS:false,
     animatedName:false,
     specialCard:false,
     profileGlow:true
    },

    createdAt:Date.now()

   };

   await setDoc(
    doc(requireDb(),"users",user.id),
    data
   );

   localStorage.removeItem("vyroReferral");

   if(ref){

    try{

     const q=await getDocs(
      query(
       collection(requireDb(),"users"),
       where("referralCode","==",ref)
      )
     );

     if(!q.empty){

      const rd=q.docs[0];

      if(rd.id!==user.id){

       const old=rd.data();

       await setDoc(
        doc(requireDb(),"users",rd.id),
        {
         xp:increment(500),
         badges:Array.from(
          new Set([
           ...(old.badges||[]),
           "referrer"
          ])
         ),
         stats:{
          ...(old.stats||{}),
          referrals:
           (old.stats?.referrals||0)+1
         }
        },
        {merge:true}
       );

      }

     }

    }catch(e){
     console.warn(e);
    }

   }

   toast("Welcome to VYRO ✦");

   location.hash="#/dashboard";

   dashboard();

  }catch(e){

   document.getElementById("claimOut").textContent=
    e.message==="taken"
     ?"Username was just taken."
     :"Something went wrong.";

   document.getElementById("claimOut").className=
    "status bad";

   b.disabled=false;
   b.textContent="Claim username";
  }

 };
}


function makeCode(n){

 return (
  n
   .replace(/[^a-z0-9]/gi,"")
   .slice(0,8)
  +
  "-"
  +
  Math.random()
   .toString(36)
   .slice(2,6)
 ).toUpperCase();

}

/* =========================
   TAB BINDINGS
========================= */

function bindTab(tab,d){

 if(tab==="profile"){

  document.getElementById("pfp").oninput=e=>{

   const v=e.target.value.trim();

   if(/^https?:\/\//i.test(v))
    document.getElementById("avatarPrev").src=v;

  };


  document
   .getElementById("avatarUpload")
   .onclick=()=>{

    const input=document.createElement("input");

    input.type="file";
    input.accept="image/*";

    input.onchange=()=>{

     const f=input.files?.[0];

     if(!f)return;

     const r=new FileReader();

     r.onload=()=>{

      document.getElementById("avatarPrev").src=
       r.result;

      toast(
       "Local preview only — paste a hosted URL to save it"
      );

     };

     r.readAsDataURL(f);

   };

   input.click();

  };


  document
   .getElementById("addLink")
   .onclick=()=>{

    document
     .getElementById("linkRows")
     .insertAdjacentHTML(
      "beforeend",
      linkRow("","")
     );

   };


  document
   .getElementById("linkRows")
   .onclick=e=>{

    const b=e.target.closest(".removeLink");

    if(b)
     b.parentElement.remove();

  };


  document
   .getElementById("saveProfile")
   .onclick=async()=>{

    const links=[
     ...document.querySelectorAll(".link-row")
    ]
    .map(r=>({
     title:r.querySelector(".lt").value.trim(),
     url:r.querySelector(".lu").value.trim()
    }))
    .filter(x=>/^https?:\/\//i.test(x.url));


    await save({

     bio:
      document
       .getElementById("bio")
       .value
       .trim(),

     pfp:
      document
       .getElementById("pfp")
       .value
       .trim(),

     banner:
      document
       .getElementById("banner")
       .value
       .trim(),

     status:
      document
       .getElementById("status")
       .value
       .trim(),

     links,

     xp:increment(50)

    });


    toast("Profile saved ✦");

    dashboard();

   };

 }


 if(tab==="appearance"){

  document
   .querySelectorAll(".swatch")
   .forEach(x=>{

    x.onclick=()=>{

     document
      .querySelectorAll(".swatch")
      .forEach(y=>
       y.classList.remove("active")
      );

     x.classList.add("active");

     d.theme=x.dataset.theme;

     applyTheme(d.theme);

    };

   });


  document
   .getElementById("saveAppearance")
   .onclick=async()=>{

    await save({

     theme:d.theme,

     effects:{
      particles:
       document.getElementById("particles").checked,

      avatarGlow:
       document.getElementById("glow").checked
     },

     customFeatures:{
      ...(d.customFeatures||{}),
      animatedName:
       document.getElementById("animatedName").checked
     }

    });

    toast("Appearance saved");

    dashboard();

   };

 }


 if(tab==="music"){

  document
   .getElementById("saveMusic")
   .onclick=async()=>{

    await save({

     music:{
      url:
       document
        .getElementById("musicUrl")
        .value
        .trim(),

      title:
       document
        .getElementById("musicTitle")
        .value
        .trim(),

      artist:
       document
        .getElementById("musicArtist")
        .value
        .trim(),

      loop:
       document
        .getElementById("musicLoop")
        .checked,

      autoplay:false
     }

    });

    toast("Music saved");

    dashboard();

   };

 }


 if(tab==="referrals"){

  document
   .getElementById("copyRef")
   .onclick=async()=>{

    const value=d.referralCode||"";

    try{

     if(navigator.clipboard?.writeText){

      await navigator.clipboard.writeText(value);

     }else{

      const t=document.createElement("textarea");

      t.value=value;

      document.body.appendChild(t);

      t.select();

      document.execCommand("copy");

      t.remove();

     }

     toast("Referral code copied");

    }catch{

     toast("Copy failed");

    }

   };

 }


 if(tab==="settings"){

  document
   .getElementById("adminAccess")
   .onclick=openAdminLogin;

 }

}

function openAdminLogin(){

 const modal=document.createElement("div");

 modal.className="modal";

 modal.innerHTML=`

 <div class="modal-card glass">

  <div class="modal-head">

   <h2>
    <i class="fa-solid fa-shield-halved"
       style="color:#fbbf24"></i>
    Restricted Area
   </h2>

   <button class="btn iconbtn"
    data-close>
    <i class="fa-solid fa-xmark"></i>
   </button>

  </div>

  <p class="sub">
   Enter the administrator credentials to
   continue.
  </p>

  <label>Username</label>

  <input
   id="adminUser"
   autocomplete="off"
   placeholder="Administrator username">

  <label>Password</label>

  <input
   id="adminPass"
   type="password"
   placeholder="Administrator password">

  <div
   id="adminLoginStatus"
   class="status">
  </div>

  <button
   class="btn primary"
   id="adminLoginBtn"
   style="width:100%;margin-top:14px">

   <i class="fa-solid fa-lock-open"></i>
   Authenticate

  </button>

 </div>
 `;

 document.body.appendChild(modal);

 modal.querySelector("[data-close]")
  .onclick=()=>modal.remove();

 modal.querySelector("#adminLoginBtn")
  .onclick=()=>{

   const u=
    modal.querySelector("#adminUser").value;

   const p=
    modal.querySelector("#adminPass").value;

   const status=
    modal.querySelector("#adminLoginStatus");


   /*
    DEMO-ONLY ADMIN LOGIN

    This is intentionally client-side because
    the supplied project is a static frontend.

    Do NOT use this authentication design for
    real privileged production access.
   */

   if(
    u==="shark" &&
    p==="September11,2001"
   ){

    adminSession=true;

    modal.remove();

    toast("Administrator authenticated");

    openAdminPanel();

   }else{

    status.textContent=
     "Invalid administrator credentials.";

    status.className="status bad";

   }

  };

}

    </div>

  </div>

  id="adminEditor"
  class="section glass hidden">
 </div>

 document
  .getElementById("adminLogout")
  .onclick=()=>{

   adminSession=false;

   toast("Admin panel locked");

   renderTab("settings",window.__currentProfile);

  };


 const search=
  document.getElementById("adminSearch");


 search.oninput=async()=>{

  const value=
   search.value.trim().toLowerCase();

  const results=
   document.getElementById("adminResults");

  if(value.length<2){

   results.innerHTML=
    '<p class="sub" style="margin-top:12px">Type at least 2 characters.</p>';

   return;

  }

  try{

   const snap=await getDocs(
    collection(requireDb(),"users")
   );

   const users=snap.docs
    .map(x=>({
     id:x.id,
     ...x.data()
    }))
    .filter(x=>
     String(x.username||"")
      .toLowerCase()
      .includes(value)
    )
    .slice(0,12);


   if(!users.length){

    results.innerHTML=
     '<p class="sub" style="margin-top:12px">No users found.</p>';

    return;

   }


   results.innerHTML=users.map(x=>`

    <div class="user-result">

     <div class="user-result-main">

      <img src="${esc(
       x.pfp ||
       "https://api.dicebear.com/9.x/shapes/svg?seed="+
       encodeURIComponent(x.username)
      )}">

      <div class="user-result-name">

       <b>${esc(x.username)}</b>

       <span>
        Level ${x.level||1}
        · ${(x.badges||[]).length} badges
       </span>

      </div>

     </div>

     <button
      class="btn small"
      data-admin-user="${esc(x.id)}">

      Manage

     </button>

    </div>

   `).join("");


   results
    .querySelectorAll("[data-admin-user]")
    .forEach(btn=>{

     btn.onclick=()=>{

      const target=
       users.find(x=>
        x.id===btn.dataset.adminUser
       );

      if(target)
       adminEditUser(target);

     };

    });


  }catch(e){

   results.innerHTML=
    '<p class="sub bad">Could not load users.</p>';

  }

 };

}

 let selected=
  new Set(currentBadges);


 editor
  .querySelectorAll("[data-badge]")
  .forEach(btn=>{

   btn.onclick=()=>{

    const id=btn.dataset.badge;

    if(selected.has(id)){
     selected.delete(id);
    }else{
     selected.add(id);
    }

    btn.querySelector("span").textContent=
     selected.has(id)?"✓":"+";

   };

  });


 document
  .getElementById("closeAdminEditor")
  .onclick=()=>{

   editor.classList.add("hidden");
   editor.innerHTML="";

  };


 document
  .getElementById("adminSaveUser")
  .onclick=async()=>{

   const customFeatures={

    ...(target.customFeatures||{}),

    animatedName:
     document
      .getElementById("featureAnimatedName")
      .checked,

    specialCard:
     document
      .getElementById("featureCard")
      .checked,

    profileGlow:
     document
      .getElementById("featureGlow")
      .checked

   };


   try{

    await setDoc(
     doc(requireDb(),"users",target.id),
     {

      xp:Number(
       document
        .getElementById("adminXP")
        .value||0
      ),

      level:Number(
       document
        .getElementById("adminLevel")
        .value||1
      ),

      status:
       document
        .getElementById("adminStatus")
        .value
        .trim(),

      badges:Array.from(selected),

      customFeatures

     },
     {merge:true}
    );


    toast(
     `@${target.username} updated`
    );


    editor.classList.add("hidden");
    editor.innerHTML="";


   }catch(e){

    console.error(e);

    toast(
     "Could not save administrator changes"
    );

   }

 };

}

/* =========================
   PUBLIC PROFILE
========================= */

function profile(name){

 navBar();

 getDocs(
  query(
   collection(requireDb(),"users"),
   where("username","==",name)
  )
 ).then(async r=>{

  if(r.empty){

   app.innerHTML=`

   <div class="profile-stage">

    <div class="card glass center">

     <h2>Profile not found</h2>

     <p class="sub" style="margin:8px 0 15px">
      That VYRO username does not exist.
     </p>

     <button
      class="btn"
      onclick="location.hash=''">
      Go home
     </button>

    </div>

   </div>

   `;

   return;
  }


  const ref=r.docs[0];
  const d=ref.data();

  applyTheme(d.theme);


  await setDoc(
   doc(requireDb(),"users",ref.id),
   {
    stats:{
     ...(d.stats||{}),
     views:(d.stats?.views||0)+1
    }
   },
   {merge:true}
  );


  let audio="";

  if(
   d.music?.url &&
   /^https?:\/\//i.test(d.music.url)
  ){

   audio=`

   <div class="music">

    <div class="music-top">

     <div class="album">
      <i class="fa-solid fa-music"></i>
     </div>

     <div class="track">

      <b>
       ${esc(
        d.music.title||
        "Profile soundtrack"
       )}
      </b>

      <span>
       ${esc(
        d.music.artist||
        "VYRO music"
       )}
      </span>

     </div>

     <button
      class="btn iconbtn small"
      id="play">

      <i class="fa-solid fa-play"></i>

     </button>

    </div>

    <input
     id="seek"
     type="range"
     min="0"
     max="100"
     value="0">

    <audio
     id="audio"
     src="${esc(d.music.url)}"
     ${d.music.loop!==false?"loop":""}>
    </audio>

   </div>

   `;

  }


  const avatar=
   d.pfp ||
   "https://api.dicebear.com/9.x/shapes/svg?seed="+
   encodeURIComponent(d.username);


  app.innerHTML=`

  <div class="profile-stage screen">

   <div class="profile-card glass">

    ${
     d.banner &&
     /^https?:\/\//i.test(d.banner)
     ?`
      <div
       class="profile-banner"
       style="background-image:url('${esc(d.banner)}')">
      </div>
     `
     :""
    }

    <div class="profile-inner">

     <img
      class="profile-avatar ${d.customFeatures?.profileGlow!==false?"glow":""}"
      src="${esc(avatar)}">


     <div
      class="profile-name"
      style="${d.customFeatures?.animatedName?'animation:float 2.5s ease-in-out infinite':''}">

      ${esc(d.username)}

     </div>


     <div class="handle">
      @${esc(d.username)}

const canvas=
 document.getElementById("bg");

const ctx=
 canvas.getContext("2d");

let pts=[];


function resize(){

 canvas.width=innerWidth;
 canvas.height=innerHeight;

 pts=Array.from(
  {
   length:
    Math.min(
     150,
     Math.floor(innerWidth/8)
    )
  },
  ()=>({
   x:Math.random()*innerWidth,
   y:Math.random()*innerHeight,
   r:Math.random()*1.4+.2,
   v:Math.random()*.25+.04,
   a:Math.random()*.5+.1
  })
 );

}


resize();

addEventListener(
 "resize",
 resize
);


(function loop(){

 ctx.clearRect(
  0,
  0,
  canvas.width,
  canvas.height
 );

 pts.forEach(p=>{

  p.y+=p.v;

  if(p.y>canvas.height)
   p.y=-2;

  ctx.fillStyle=
   `rgba(255,255,255,${p.a})`;

  ctx.beginPath();

  ctx.arc(
   p.x,
   p.y,
   p.r,
   0,
   Math.PI*2
  );

  ctx.fill();

 });

 requestAnimationFrame(loop);

})();
